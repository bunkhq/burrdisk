[package]
name = "burrdisk"
version = "0.3.1"
edition = "2024"
description = "A fast, friendly disk space visualizer"
license = "MIT"
repository = "https://github.com/bunkhq/burrdisk"

[dependencies]
anyhow = "1"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rayon = "1.12"
serde_json = "1"
sha2 = "0.10"
sysinfo = { version = "0.39", default-features = false, features = ["disk"] }
trash = "5"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[features]
default = []
# Compile Metal shaders at runtime instead, for building without a full Xcode install.
runtime_shaders = ["gpui/runtime_shaders"]

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
